version: '3.9'

services:
  moses:
    build: .
    container_name: moses
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - ./exports:/app/exports
      - ./mixes:/app/mixes
      - ./workspaces:/app/workspaces
      - ./models:/app/models
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./moses.db:/app/moses.db
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
