services:
  moses:
    build:
      context: .
      dockerfile: docker/Containerfile.gpu
    container_name: moses
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - ./exports:/app/exports
      - ./mixes:/app/mixes
      - ./workspaces:/app/workspaces
      - ./models:/app/models
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MOSES_DB_PATH=/app/data/moses.db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
