services:
  moses:
    build:
      context: ..
      dockerfile: docker/Containerfile.cpu
    container_name: moses-cpu
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - MOSES_DB_PATH=/app/data/moses.db
    volumes:
      - ../exports:/app/exports
      - ../mixes:/app/mixes
      - ../workspaces:/app/workspaces
      - ../cache:/app/cache
      - ../logs:/app/logs
      - ../data:/app/data
