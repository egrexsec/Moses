version: '3.9'

services:
  moses:
    build:
      context: ..
      dockerfile: docker/Containerfile.gpu
    container_name: moses-gpu
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../exports:/app/exports
      - ../mixes:/app/mixes
      - ../workspaces:/app/workspaces
      - ../cache:/app/cache
      - ../logs:/app/logs
